# ============================================================
# Configuración del Proyecto
# Análisis Estadístico de la Felicidad Estudiantil - UST
# ============================================================

project:
  name: "Análisis estadístico e inteligente de la felicidad estudiantil"
  institution: "Universidad Santo Tomás"
  version: "0.1.0"

# ------------------------------------------------------------
# Estructura de la encuesta
# ------------------------------------------------------------
survey:
  scale_name: "Escala de Bienestar Psicológico de Ryff"
  scale_type: "Likert"
  scale_range: [1, 6]  # 1 = Totalmente en desacuerdo, 6 = Totalmente de acuerdo
  num_items: 29
  reference: "Díaz, D., Rodríguez-Carvajal, R., Blanco, A., et al. (2006). Adaptación española de las escalas de bienestar psicológico de Ryff. Psicothema, 18(3), 572-577."

  # Dimensiones de la escala (Ryff, adaptación española de Díaz et al., 2006)
  dimensions:
    - id: "SA"
      name: "Autoaceptación"
      num_items: 4
      items: [1, 7, 17, 24]  # Ítems que pertenecen a esta dimensión

    - id: "PR"
      name: "Relaciones Positivas"
      num_items: 5
      items: [2, 8, 12, 22, 25]

    - id: "AU"
      name: "Autonomía"
      num_items: 6
      items: [3, 9, 13, 18, 23, 29]

    - id: "DE"
      name: "Dominio del Entorno"
      num_items: 5
      items: [5, 10, 11, 14, 19]

    - id: "PV"
      name: "Propósito de Vida"
      num_items: 5
      items: [4, 6, 15, 16, 20]

    - id: "CP"
      name: "Crecimiento Personal"
      num_items: 4
      items: [21, 26, 27, 28]

  # Ítems invertidos (respuestas negativas = mayor bienestar)
  # Estos ítems deben ser recodificados antes del análisis
  reverse_items: [2, 4, 5, 8, 9, 13, 19, 22, 23, 26]

# ------------------------------------------------------------
# Variables demográficas / agrupadoras
# ------------------------------------------------------------
grouping_variables:
  - "genero"
  - "edad"
  - "pais_residencia"
  - "departamento_residencia"
  - "estrato_socioeconomico"
  - "nivel_formacion"
  - "modalidad"
  - "semestre"
  - "sede_seccional"
  - "programa_formacion"
  - "cau"

# ------------------------------------------------------------
# Rutas del proyecto
# ------------------------------------------------------------
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_external: "data/external"
  reports: "reports"
  figures: "reports/figures"
  configs: "configs"

# ------------------------------------------------------------
# Parámetros de análisis
# ------------------------------------------------------------
analysis:
  # Consistencia interna
  cronbach_alpha_threshold: 0.70

  # Correlaciones
  correlation_method: "spearman"  # spearman o pearson

  # Clustering
  clustering:
    method: "kmeans"
    max_clusters: 8
    random_state: 42

  # Significancia estadística
  significance_level: 0.05

# ------------------------------------------------------------
# Parámetros de visualización
# ------------------------------------------------------------
visualization:
  style: "seaborn-v0_8-whitegrid"
  palette: "viridis"
  figure_dpi: 150
  save_format: "png"

